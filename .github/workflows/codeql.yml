name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-15
            build-mode: manual
          - language: python
            runner: ubuntu-latest
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache SwiftPM dependencies
        if: matrix.language == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve SwiftPM dependencies
        if: matrix.language == 'swift'
        run: ./scripts/swift.sh package resolve

      - name: Prepare Swift build caches
        if: matrix.language == 'swift'
        env:
          REQNIVO_SKIP_RESOLVE: '1'
        run: |
          time ./scripts/swift.sh build \
            -Xswiftc -module-cache-path -Xswiftc "$PWD/.cache/swift-modules"
          # Keep the shared manifest/SDK caches, but force source compilation under CodeQL.
          ./scripts/swift.sh package clean

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/config.yml

      - name: Build Swift sources
        if: matrix.language == 'swift'
        env:
          REQNIVO_SKIP_RESOLVE: '1'
        run: |
          time ./scripts/swift.sh build --verbose \
            -Xswiftc -module-cache-path -Xswiftc "$PWD/.cache/swift-modules"

      - name: Analyze sources
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
